<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz with an AI assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Quiz with an AI assistant</div>
    <div id="progress" class="progress" aria-live="polite"></div>
  </header>
  <div id="record" class="record" aria-label="Running scores"></div>
  <div id="build" class="build" hidden></div>
  <main id="main" class="main"><p class="muted">Loading session…</p></main>
  <div id="overlay" class="overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
